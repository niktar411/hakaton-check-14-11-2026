user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    server_names_hash_bucket_size 128;
    # Static file metadata cache: saves repeated open/stat syscalls for
    # hashed assets and icons.
    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    log_format audit '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log audit buffer=32k flush=5s;

    # Serve the pre-compressed .gz files emitted by the build
    # (client/vite-plugins/compress.ts) before falling back to dynamic gzip.
    # Brotli: the nginx image ships without ngx_brotli; when a brotli-enabled
    # image is available, emit .br in the build and add `brotli_static on`.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
