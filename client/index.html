<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="index,follow" />
		<meta name="theme-color" content="#0a0a0a" />
		<link rel="icon" type="image/svg+xml" href="/dragon.svg" />
		<link rel="icon" type="image/png" sizes="192x192" href="/dragon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/dragon-180.png" />
		<title>Драконы</title>
		<!-- Inlined theme boot: applies the saved theme before first paint and
		     removes the render-blocking /theme-boot.js request. The CSP in
		     client/snippets/security-headers.conf and the API server CSP allow
		     this exact script by its sha256 hash — update both when editing.
		     Inline <style> blocks rely on style-src 'unsafe-inline': Tailwind
		     v4 rewrites their contents at build time, so a hash would break. -->
		<script>try{const s=localStorage.getItem("portal-theme");const t=s==="light"||s==="dark"?s:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch{document.documentElement.dataset.theme="light"}</script>
	</head>
	<body>
		<div id="root">
			<!-- Static splash: first paint before the JS bundle arrives; the
			     Solid render call replaces the #root contents on hydration. -->
			<style>.boot-splash{position:fixed;inset:0;display:grid;place-items:center;font:14px system-ui,sans-serif;color:gray}</style>
			<div class="boot-splash" data-boot>Загрузка…</div>
		</div>
		<script type="module" src="/src/app/main.tsx"></script>
	</body>
</html>
