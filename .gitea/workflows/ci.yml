name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checks
        run: bun run check
      - name: Build client
        run: bun run build:client
      - name: Typecheck client
        run: bun run typecheck:client
      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium
      - name: Browser tests
        run: bun x playwright test

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Go
        run: |
          curl -fsSL https://go.dev/dl/go1.27.3.linux-amd64.tar.gz -o /tmp/go.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          sudo ln -s /usr/local/go/bin/go /usr/local/bin/go
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Contract is generated
        run: |
          bun run gen:api
          git diff --exit-code -- api/openapi.json client/src/shared/api/schema.d.ts

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portal
          POSTGRES_DB: portal_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://portal@postgres:5432/portal_test?sslmode=disable
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        run: |
          curl -fsSL https://go.dev/dl/go1.27.3.linux-amd64.tar.gz -o /tmp/go.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          sudo ln -s /usr/local/go/bin/go /usr/local/bin/go
      - name: Install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate and verify sqlc
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/db/sqlc
      - name: Test
        working-directory: server
        run: |
          go test -p 1 ./...
          go vet ./...
          go build ./cmd/...
