mixed-port: 7890
allow-lan: false
mode: "rule"
log-level: "warning"
ipv6: false
dns:
  enable: false
proxy-providers:
  team-vpn-local:
    type: "file"
    path: "/etc/mihomo/team-vpn.local.yaml"
    health-check:
      enable: false
proxy-groups:
  - name: "TEAM-VPN"
    type: "select"
    use:
      - "team-vpn-local"
rules:
  - "IP-CIDR,10.77.0.0/24,TEAM-VPN,no-resolve"
  - "MATCH,DIRECT"
