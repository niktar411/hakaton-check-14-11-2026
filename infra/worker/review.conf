server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/reviews;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ~* (?:^|/)(?:\.|.*(?:credential|secret|password).*) { return 404; }
    location ~* \.(?:pem|key|p12|pfx|jks|keystore|kdbx|ovpn)$ { return 404; }
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ "^/(?<task>task-[1-9][0-9]{0,3})(?:/|$)" {
        try_files $uri $uri/ /$task/index.html =404;
    }
    location / { return 404; }
}
