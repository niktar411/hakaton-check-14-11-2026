name: hackathon-worker

# SERVER 2 — coding, review and temporary test databases. No public ports:
# the API and the review links are reachable only over the team VPN.
services:
  worker-agent:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    image: hackathon-worker-agent:local
    restart: unless-stopped
    env_file:
      - ${WORKER_ENV_FILE:-/etc/hackathon/worker.env}
    environment:
      WORKER_BIND_IP: 10.77.0.10
      WORKER_CALLER_IP: 10.77.0.1
      WORKER_PORT: 9102
      WORKER_COMPOSE_FILE: /opt/hackathon/docker-compose.worker.yml
      WORKER_COMPOSE_ENV_FILE: /etc/hackathon/worker.env
    network_mode: host
    pid: host
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/hackathon-worker/workspaces:/var/lib/hackathon-worker/workspaces
      - /var/lib/hackathon-worker/reviews:/var/lib/hackathon-worker/reviews
      - /var/lib/hackathon-worker/state:/var/lib/hackathon-worker/state
      - /opt/hackathon/docker-compose.worker.yml:/opt/hackathon/docker-compose.worker.yml:ro
      - /etc/hackathon/worker.env:/etc/hackathon/worker.env:ro
    group_add: ["${DOCKER_GID:?set DOCKER_GID}"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 256
    cpus: 1
    healthcheck:
      # The agent binds only the VPN address, so the probe must use it too.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://10.77.0.10:9102/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  coding-image:
    profiles: [images]
    build:
      context: .
      dockerfile: infra/worker/images/coding.Dockerfile
    image: hackathon-worker-coding:local

  review:
    build:
      context: .
      dockerfile: infra/worker/review.Dockerfile
    image: hackathon-worker-review:local
    restart: unless-stopped
    # Bound to the VPN interface only — never 0.0.0.0.
    ports:
      - "10.77.0.10:8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=1777
    volumes:
      - /var/lib/hackathon-worker/reviews:/srv/reviews:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 128
    cpus: 1

  postgres-image:
    profiles: [images]
    image: postgres:18.1-alpine3.22
