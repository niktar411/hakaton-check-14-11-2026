services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon-opencode
    restart: unless-stopped
    env_file:
      - /etc/hackathon/opencode.env
    environment:
      OPENCODE_LOG_LEVEL: INFO
    working_dir: /hackathon
    volumes:
      - /srv/opencode/workspace:/hackathon
      - /srv/opencode/config:/root/.config/opencode
      - /srv/opencode/data:/root/.local/share/opencode
    ports:
      - "127.0.0.1:4096:4096"
    mem_limit: 1200m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u "opencode:$$OPENCODE_PASSWORD" http://127.0.0.1:4096/global/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hackathon-main

networks:
  hackathon-main:
    external: true
